version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnenglish-postgres
    environment:
      POSTGRES_DB: learnenglish
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnenglish"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/src/LearnEnglish.Api/Dockerfile
    container_name: learnenglish-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=learnenglish;Username=postgres;Password=postgrespassword
      - DatabaseProvider=postgres
      - Jwt__Key=PaperclipLearnEnglishDefaultSecretKeyForJwtAuthentication2026!
      - Jwt__Issuer=LearnEnglishApi
      - Jwt__Audience=LearnEnglishClient
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: learnenglish-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
